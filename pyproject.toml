[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carscout"
version = "1.0.0"
description = "Resident multi-platform used-car listing crawler, dedup and merge service"
requires-python = ">=3.11"
dependencies = [
  "Scrapy==2.11.2",
  "scrapy-playwright==0.0.42",
  "playwright==1.47.0",
  "w3lib==2.2.1",
  "Twisted==24.11.0",
  "asgiref==3.8.1",
  "psycopg[binary]==3.2.3",
  "psycopg-pool==3.2.4",
  "redis==5.2.1",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "python-multipart==0.0.20",
  "click==8.1.8",
  "pillow==11.1.0",
  "numpy==2.2.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[project.scripts]
carscout = "carscout.cli:cli"

[tool.setuptools]
packages = ["carscout", "carscout.db", "carscout.crawl", "carscout.api", "carscout.fixture"]

[tool.setuptools.package-data]
carscout = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that need the fixture server and Playwright"]
